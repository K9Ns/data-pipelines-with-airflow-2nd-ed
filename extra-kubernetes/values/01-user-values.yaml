# Override default values in the Apache Airflow Helm Chart
#
defaultAirflowTag: "3.1.2"
airflowVersion: "3.1.2"

# override bitnami image in subchart
postgresql:
  image:
    repository: postgres
    tag: "16"

# 1 - Overriding the default user
webserver:
  # Create initial user.
  defaultUser:
    enabled: true
    role: Admin
    username: airflow
    email: airflow@example.com
    firstName: Airflow
    lastName: Second Edition
    password: airflow
